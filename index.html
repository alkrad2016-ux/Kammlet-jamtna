<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>كملت جمعتنا</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f7f5f0;
  color: #17243d;
}

header {
  background: #14213d;
  color: white;
  text-align: center;
  padding: 30px 15px;
  border-bottom: 4px solid #d4af37;
}

header h1 {
  margin: 0 0 12px;
  color: #f0cf69;
  font-size: 30px;
}

header p {
  margin: 0;
  font-size: 17px;
}

main {
  padding: 20px 15px;
  max-width: 700px;
  margin: auto;
}

h2 {
  text-align: center;
  margin: 10px 0 20px;
}

.grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
}

.card {
  background: white;
  border: 1px solid #e5d7a5;
  border-radius: 14px;
  padding: 22px 8px;
  text-align: center;
  box-shadow: 0 3px 8px #0000000d;
}

.icon {
  font-size: 36px;
}

.card h3 {
  margin: 12px 0 0;
  font-size: 16px;
}

.welcome {
  text-align: center;
  line-height: 1.8;
  margin-top: 25px;
}

footer {
  text-align: center;
  background: #14213d;
  color: white;
  padding: 18px 10px;
  margin-top: 25px;
  font-size: 14px;
}

</style>
</head>

<body>

<header>
  <h1>كملت جمعتنا 🎉</h1>
  <p>كل مناسباتك بمكان واحد</p>
</header>

<main>
  <h2>اكتشف خدمات المناسبات</h2>

  <div class="grid">

    <div class="card">
      <div class="icon">💍</div>
      <h3>أفراح وأعراس</h3>
    </div>

    <div class="card">
      <div class="icon">🏛️</div>
      <h3>صالات ومزارع</h3>
    </div>

    <div class="card">
      <div class="icon">🎤</div>
      <h3>مطربين وفرق</h3>
    </div>

    <div class="card">
      <div class="icon">🍽️</div>
      <h3>طعام وضيافة</h3>
    </div>

    <div class="card">
      <div class="icon">📸</div>
      <h3>تصوير ومصورون</h3>
    </div>

    <div class="card">
      <div class="icon">🌸</div>
      <h3>ديكور وورد</h3>
    </div>

  </div>

  <div class="welcome">
    <h2>أهلاً وسهلاً فيكم ❤️</h2>
    <p>كل اللي بتحتاجوه لمناسباتكم في مكان واحد.</p>
    <p>نبدأ معكم من درعا، سوريا.</p>
  </div>

</main>

<footer>
  كملت جمعتنا © 2026
</footer>

<script>
document.querySelectorAll('.card').forEach(function(card) {
  card.style.cursor = 'pointer';

  card.addEventListener('click', function() {
    var title = card.querySelector('h3').textContent;

    alert('أهلاً بك في قسم ' + title +
      '\nسيتم إضافة مقدمي الخدمات قريباً ❤️');
  });
});
</script>
</body>
</html>
