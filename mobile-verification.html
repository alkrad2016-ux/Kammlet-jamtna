<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-store"><title>جاهزية الطلب — كملت جمعتنا</title><style>body{margin:0;background:#fff;font:14px Tahoma;color:#14213d}#status{padding:6px}</style></head><body><div id="status" role="status">يمكنك متابعة إرسال الطلب.</div><script>
'use strict';
// Compatibility bridge for installed apps. The server validates and limits submissions;
// this value is a readiness signal, not a CAPTCHA or an authorization credential.
const action=new URLSearchParams(location.search).get('action');
const allowed=new Set(['capacitor://localhost','http://localhost','https://localhost']);
addEventListener('message',e=>{
 if(e.source!==parent||!allowed.has(e.origin)||e.data?.channel!=='kammlet-verification-v1'||e.data.action!==action||!['booking','join'].includes(action))return;
 if(!['init','reset'].includes(e.data.type))return;
 parent.postMessage({channel:'kammlet-verification-v1',action,type:'token',token:'server-validated-submission-v1'},e.origin);
});
</script></body></html>
